name: basak_mobile
description: "University Bus Subscription System (باصك - Basak) - Flutter Mobile Client for Students and Supervisors"
publish_to: "none"
version: 1.0.19+49

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Network
  supabase_flutter: ^2.8.0
  # The receipt upload is one streamed request (for its progress bar).
  http: ^1.2.0

  # Push notifications (FCM; APNs through FCM on iOS). Configured with
  # --dart-define, see lib/core/constants/firebase_config.dart.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # State Management
  flutter_riverpod: ^2.6.1

  # QR Code & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Image & File Handling (Receipt uploads)
  image_picker: ^1.1.2
  image: ^4.2.0
  cached_network_image: ^3.4.1

  # Local Storage
  flutter_secure_storage: ^9.2.2
  # Only to move a session saved by an older version (see secure_session_storage.dart).
  shared_preferences: ^2.5.3

  # Utilities
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  pdf: ^3.12.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  flutter_contacts: ^2.1.0
  printing: ^5.14.3
  gal: ^2.3.3
  local_auth: ^3.0.2
  in_app_review: ^2.0.12
  local_auth_android: ^2.2.0
  local_auth_darwin: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/basak_icon.webp
    # Licenses of the bundled fonts below.
    - assets/fonts/READEX_PRO_OFL.txt
    - assets/fonts/CAIRO_OFL.txt
    # Receipts as PDF: the PDF library needs a font with Arabic presentation forms.
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-SemiBold.ttf
    - assets/fonts/Cairo-Bold.ttf
    - assets/fonts/LUCIDE_FLUTTER_LICENSE.txt

  fonts:
    # Bundled so every screen renders in Readex Pro from the first frame, offline too.
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
    # Icons (lib/core/theme/app_icons.dart); tree-shaken to the used glyphs.
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide.ttf

